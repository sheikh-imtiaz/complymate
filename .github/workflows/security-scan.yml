name: Security scan

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 19 * * 0" # weekly, Monday morning AEST

permissions:
  contents: read
  security-events: write

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with: { version: "0.5.11" }
      - run: cd services/api && uv sync --extra dev && uv run pip-audit --strict --progress-spinner off

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high --prod

  checkov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra/terraform
          config_file: infra/policies/checkov.yaml
          output_format: sarif
          output_file_path: checkov.sarif
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with: { sarif_file: checkov.sarif, category: checkov }

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t complymate-api:scan services/api
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: complymate-api:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy.sarif
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with: { sarif_file: trivy.sarif, category: trivy }

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
