name: Deploy Azure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "staging | prod"
        required: true
        default: staging

permissions:
  id-token: write # GitHub OIDC → Entra workload identity federation
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: azure-${{ github.event.inputs.environment }}
    env:
      ENV: ${{ github.event.inputs.environment }}
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_external_id_tenant_id: ${{ secrets.AZURE_EXTERNAL_ID_TENANT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push images to ACR
        run: |
          ACR="${{ vars.AZURE_ACR_NAME }}"
          az acr login --name "$ACR"
          REG="$ACR.azurecr.io"
          docker build -t "$REG/complymate-api:$GITHUB_SHA" services/api
          docker build -f apps/web/Dockerfile -t "$REG/complymate-web:$GITHUB_SHA" \
            --build-arg NEXT_PUBLIC_API_URL=${{ vars.API_URL }} --build-arg NEXT_PUBLIC_WS_URL=${{ vars.WS_URL }} \
            --build-arg NEXT_PUBLIC_WS_MODE=native --build-arg NEXT_PUBLIC_AUTH_MODE=oidc \
            --build-arg NEXT_PUBLIC_OIDC_ISSUER=${{ vars.OIDC_ISSUER }} --build-arg NEXT_PUBLIC_OIDC_CLIENT_ID=${{ vars.WEB_CLIENT_ID }} .
          docker build -f apps/platform-admin/Dockerfile -t "$REG/complymate-admin:$GITHUB_SHA" \
            --build-arg NEXT_PUBLIC_API_URL=${{ vars.API_URL }} --build-arg NEXT_PUBLIC_AUTH_MODE=oidc \
            --build-arg NEXT_PUBLIC_OIDC_ISSUER=${{ vars.OIDC_ISSUER }} --build-arg NEXT_PUBLIC_OIDC_CLIENT_ID=${{ vars.ADMIN_CLIENT_ID }} .
          docker push "$REG/complymate-api:$GITHUB_SHA"
          docker push "$REG/complymate-web:$GITHUB_SHA"
          docker push "$REG/complymate-admin:$GITHUB_SHA"
          echo "TF_VAR_api_image=$REG/complymate-api:$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "TF_VAR_web_image=$REG/complymate-web:$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "TF_VAR_admin_image=$REG/complymate-admin:$GITHUB_SHA" >> "$GITHUB_ENV"

      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.9.8, terraform_wrapper: false }

      - name: Terraform apply
        working-directory: infra/terraform/envs/azure-${{ env.ENV }}
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=tfstate" -backend-config="use_oidc=true"
          terraform apply -input=false -auto-approve

      - name: Run migrations (Container Apps job, one-off)
        run: |
          RG="rg-complymate-${ENV}"
          az containerapp job create --name "complymate-${ENV}-migrate" --resource-group "$RG" \
            --environment "complymate-${ENV}-cae" --trigger-type Manual --replica-timeout 900 \
            --image "$TF_VAR_api_image" --args migrate --registry-server "${{ vars.AZURE_ACR_NAME }}.azurecr.io" \
            --mi-user-assigned "complymate-${ENV}-app" --registry-identity "complymate-${ENV}-app" 2>/dev/null || true
          az containerapp job start --name "complymate-${ENV}-migrate" --resource-group "$RG"
