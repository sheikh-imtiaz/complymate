name: Nightly agent evals

on:
  schedule:
    - cron: "23 16 * * *" # 02:23 AEST
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  guardrails:
    name: Guardrail evals (no model)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with: { version: "0.5.11" }
      - run: cd services/api && uv sync --extra dev && uv run pytest -q tests/evals

  model:
    name: Model evals against staging (Bedrock + rule library)
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-2
      - name: Run evals inside the VPC (worker Lambda)
        run: |
          # The eval runner uses the staging database (rule library) and Bedrock via the worker image.
          aws lambda invoke --function-name complymate-staging-worker --cli-binary-format raw-in-base64-out \
            --payload '{"task":"run_evals","payload":{"tenant_id":"${{ vars.EVAL_TENANT_ID }}","min_score":0.85}}' /tmp/evals.json
          cat /tmp/evals.json
          python3 -c "import json,sys; r=json.load(open('/tmp/evals.json')); sys.exit(0 if r.get('score',0)>=r.get('min_score',0.85) else 1)"
