name: Deploy AWS

# main → dev automatically; staging/prod by manual dispatch (protected GitHub environments with reviewers).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "dev | staging | prod"
        required: true
        default: staging

permissions:
  id-token: write # GitHub OIDC → AWS (no stored keys)
  contents: read

env:
  AWS_REGION: ap-southeast-2
  TF_VERSION: 1.9.8

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}
    concurrency: deploy-aws-${{ github.event.inputs.environment || 'dev' }}
    env:
      ENV: ${{ github.event.inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push API image (API + workers)
        id: image
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/complymate-api:${GITHUB_SHA}"
          docker build -t "$IMAGE" services/api
          docker push "$IMAGE"
          echo "uri=$IMAGE" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform apply
        working-directory: infra/terraform/envs/aws-${{ env.ENV }}
        env:
          TF_VAR_github_access_token: ${{ secrets.AMPLIFY_GITHUB_TOKEN }}
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          terraform init -input=false \
            -backend-config="bucket=complymate-tfstate-${ENV}-${ACCOUNT}" \
            -backend-config="dynamodb_table=complymate-tflock-${ENV}"
          terraform apply -input=false -auto-approve -var "image_uri=${{ steps.image.outputs.uri }}"
          echo "WORKER=$(terraform output -raw worker_function)" >> "$GITHUB_ENV"

      - name: Run database migrations (owner role, inside the VPC)
        run: |
          aws lambda wait function-updated --function-name "$WORKER"
          aws lambda invoke --function-name "$WORKER" --cli-binary-format raw-in-base64-out \
            --payload '{"task":"migrate"}' /tmp/migrate.json
          cat /tmp/migrate.json
          grep -q '"migrated"' /tmp/migrate.json

      - name: Load reference data (first deploy / refresh)
        if: env.ENV == 'dev'
        run: |
          aws lambda invoke --function-name "$WORKER" --cli-binary-format raw-in-base64-out \
            --payload '{"task":"seed_reference"}' /tmp/seed.json
          cat /tmp/seed.json

      - name: Smoke test
        working-directory: infra/terraform/envs/aws-${{ env.ENV }}
        run: |
          API=$(terraform output -raw api_url)
          for i in 1 2 3 4 5; do curl -fsS "$API/health" && exit 0; sleep 10; done
          exit 1
