[project]
name = "complymate"
version = "0.1.0"
description = "ComplyMate API and workers: AML/CTF compliance agent for small firms"
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "email-validator>=2.2",
  "python-multipart>=0.0.17",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "pgvector>=0.3.6",
  "pyjwt[crypto]>=2.10",
  "httpx>=0.28",
  "pyyaml>=6.0.2",
  "rapidfuzz>=3.10",
  "jellyfish>=1.1",
  "python-docx>=1.1.2",
  "weasyprint>=63.0",
  "jinja2>=3.1.4",
  "openpyxl>=3.1.5",
  "cryptography>=43",
  "structlog>=24.4",
  "opentelemetry-api>=1.28",
  "opentelemetry-sdk>=1.28",
  "opentelemetry-exporter-otlp-proto-http>=1.28",
  "opentelemetry-instrumentation-fastapi>=0.49b0",
  "stripe>=11.3",
  "strands-agents>=1.0",
  "boto3>=1.35",
  "mangum>=0.19",
  "awslambdaric>=3.0",
]

[project.optional-dependencies]
azure = [
  "azure-identity>=1.19",
  "azure-storage-blob>=12.24",
  "azure-servicebus>=7.13",
  "azure-keyvault-secrets>=4.9",
  "azure-keyvault-keys>=4.10",
  "azure-ai-documentintelligence>=1.0",
  "azure-communication-email>=1.0",
  "azure-mgmt-appcontainers>=3.1",
  "openai>=1.57",
]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "testcontainers[postgres]>=4.9",
  "moto[s3,sqs,ses,secretsmanager,kms,scheduler]>=5.0",
  "ruff>=0.8",
  "mypy>=1.13",
  "types-PyYAML",
  "boto3-stubs[s3,sqs,ses,secretsmanager,kms,textract,cognito-idp,scheduler,bedrock-runtime]",
  "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/complymate"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101", "B008", "RUF012", "S608", "E501", "UP046", "RUF005"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ASYNC", "B017"]
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
warn_unused_ignores = false
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
  "integration: needs a real PostgreSQL (Testcontainers or TEST_DATABASE_ADMIN_URL)",
  "contract: adapter contract tests",
  "evals: agent guardrail evals",
]
