<!doctype html>
<html><body style="font-family: Arial, sans-serif; color: #1a1a1a; max-width: 560px; margin: auto;">
  <h2 style="color:#0F4C81;">You're invited to {{ firm }}</h2>
  <p>Hi {{ name or 'there' }},</p>
  <p>You have been invited to join <strong>{{ firm }}</strong> on ComplyMate, the AML/CTF compliance workspace.</p>
  <p><a href="{{ link }}" style="background:#0F4C81;color:#fff;padding:10px 18px;border-radius:6px;text-decoration:none;">Accept invitation</a></p>
  <p style="color:#666;font-size:13px;">This invitation expires on {{ expires }}. You will set up multi-factor authentication when you sign in.</p>
</body></html>
